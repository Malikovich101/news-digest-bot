name: Manage Channels

on:
  schedule:
    # Commands are applied within ten minutes without competing continuously
    # with the digest's state commit.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

concurrency:
  group: news-digest-repository-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-commands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Check for bot commands
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 manage_channels.py

      - name: Save channels back to repo
        run: |
          git config user.name "news-digest-bot"
          git config user.email "actions@github.com"
          git add channels.txt
          if [ -f bot_offset.json ]; then
            git add bot_offset.json
          fi
          if ! git diff --staged --quiet; then
            git commit -m "Update channels [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              git rebase --abort || true
              sleep "$attempt"
            done
            exit 1
          fi
