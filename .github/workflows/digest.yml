name: News Digest

on:
  schedule:
    # 08:05, 14:05 and 20:05 Europe/Perm (UTC+5).
    - cron: '5 3 * * *'
    - cron: '5 9 * * *'
    - cron: '5 15 * * *'
  workflow_dispatch:
    inputs:
      replay_hours:
        description: 'Повторно собрать новости за N последних часов (0 — только новые)'
        required: false
        default: '0'
        type: string
      slot_id:
        description: 'Идентификатор пропущенного слота; задаётся watchdog автоматически'
        required: false
        default: ''
        type: string

concurrency:
  group: news-digest-repository-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Determine delivery slot
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_SLOT: ${{ inputs.slot_id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "slot_id=$DISPATCH_SLOT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$SCHEDULE" in
            "5 3 * * *") suffix="morning" ;;
            "5 9 * * *") suffix="day" ;;
            "5 15 * * *") suffix="evening" ;;
            *) echo "Unknown schedule: $SCHEDULE" >&2; exit 1 ;;
          esac
          echo "slot_id=$(date -u +%F)-$suffix" >> "$GITHUB_OUTPUT"

      - name: Run digest script
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPLAY_HOURS: ${{ inputs.replay_hours || '0' }}
          DIGEST_SLOT_ID: ${{ steps.slot.outputs.slot_id }}
        run: python digest.py

      - name: Commit updated state.json
        if: always()
        run: |
          if [ -f state.json ]; then
            # normalize delivered_chunks to avoid unbounded growth in commits
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path("state.json")
          if p.exists():
              s = json.loads(p.read_text(encoding="utf-8"))
              # keep file tidy - clear delivered_chunks after successful send (optional)
              # don't clear pending/delivered_ids - they are needed for dedup
              s["delivered_chunks"] = []
              p.write_text(json.dumps(s, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          fi
          if [ -n "$(git status --porcelain state.json run_history.jsonl)" ]; then
            git config user.name "news-digest-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json run_history.jsonl
            git commit -m "chore: update runtime state [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              git rebase --abort || true
              sleep "$attempt"
            done
            echo "Unable to persist runtime state after retries." >&2
            exit 1
          else
            echo "state.json unchanged, nothing to commit."
          fi

      - name: Notify on failure
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d text="⚠️ News Digest: запуск завершился ошибкой. Смотри Actions: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
