name: News Digest

on:
  schedule:
    # Не начало часа: GitHub чаще задерживает планировщик на пиковых отметках.
    - cron: '5 3 * * *'   # 08:05 Пермь (UTC+5)
    - cron: '5 9 * * *'   # 14:05 Пермь (UTC+5)
    - cron: '5 15 * * *'  # 20:05 Пермь (UTC+5)
  workflow_dispatch:
    inputs:
      replay_hours:
        description: 'Повторно собрать новости за N последних часов (0 — только новые)'
        required: false
        default: '0'
        type: string

concurrency:
  group: news-digest-runtime-state
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify repository state
        run: |
          echo "Checked out commit: $(git rev-parse HEAD)"
          echo "Origin main: $(git rev-parse origin/main)"

      - name: Restore runtime state from cache
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: news-digest-state-${{ github.run_id }}
          restore-keys: |
            news-digest-state-

      - name: Migrate existing tracked state on first cache miss
        if: steps.restore-state.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [ -f state.json ]; then
            echo "State restored from workspace."
            exit 0
          fi

          last_state_commit=""
          while read -r commit; do
            if git cat-file -e "${commit}:state.json" 2>/dev/null; then
              last_state_commit="$commit"
              break
            fi
          done < <(git log --all --format=%H -- state.json)

          if [ -n "$last_state_commit" ]; then
            echo "Migrating state.json from historical commit $last_state_commit"
            git show "${last_state_commit}:state.json" > state.json
          else
            echo "No historical state found; starting with empty runtime state."
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests in isolated workspace
        run: |
          TEST_DIR="$(mktemp -d)"
          tar --exclude=.git --exclude=state.json --exclude='state.json.tmp' -cf - . | tar -xf - -C "$TEST_DIR"
          cd "$TEST_DIR"
          python -m unittest discover -s tests -v

      - name: Run digest script
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPLAY_HOURS: ${{ inputs.replay_hours || '0' }}
        run: python run_digest.py

      - name: Clear completed delivery checkpoints
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("state.json")
          if path.exists():
              state = json.loads(path.read_text(encoding="utf-8"))
              state["delivered_chunks"] = []
              path.write_text(
                  json.dumps(state, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Save runtime state to cache
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: news-digest-state-${{ github.run_id }}
