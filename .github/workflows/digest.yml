name: News Digest

on:
  schedule:
    # Не начало часа: GitHub чаще задерживает планировщик на пиковых отметках.
    - cron: '5 3 * * *'   # 08:05 Пермь (UTC+5)
    - cron: '5 9 * * *'   # 14:05 Пермь (UTC+5)
    - cron: '5 15 * * *'  # 20:05 Пермь (UTC+5)
  workflow_dispatch:
    inputs:
      replay_hours:
        description: 'Повторно собрать новости за N последних часов (0 — только новые)'
        required: false
        default: '0'
        type: string

concurrency:
  group: news-digest-repository-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Run digest script
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPLAY_HOURS: ${{ inputs.replay_hours || '0' }}
        run: python digest.py

      - name: Save state back to repo
        run: |
          git config user.name "news-digest-bot"
          git config user.email "actions@github.com"
          git add state.json || true
          git diff --staged --quiet || git commit -m "Update state [skip ci]"
          git push

