name: Digest Watchdog

on:
  schedule:
    - cron: '10,30,50 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: digest-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Find oldest missing slot
        id: check
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          now = datetime.datetime.now(datetime.timezone.utc)
          path = Path("state.json")
          state = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          completed = state.get("completed_slots", {}) or {}

          slots = []
          start_day = now.date() - datetime.timedelta(days=2)
          for offset in range(4):
              day = start_day + datetime.timedelta(days=offset)
              for name, hour in (("morning", 3), ("day", 9), ("evening", 15)):
                  expected = datetime.datetime.combine(day, datetime.time(hour, 5), tzinfo=datetime.timezone.utc)
                  slot_id = f"{day.isoformat()}-{name}"
                  # Give the scheduled run 45 minutes to complete, then make the slot eligible for recovery.
                  if expected + datetime.timedelta(minutes=45) <= now and slot_id not in completed:
                      slots.append((expected, slot_id))

          slots.sort()
          slot_id = slots[0][1] if slots else ""
          print(f"now={now.isoformat()} missing={slot_id or 'none'} completed={len(completed)}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"slot_id={slot_id}\n")
          PY

      - name: Check active digest runs
        id: active
        if: steps.check.outputs.slot_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --workflow "News Digest" --repo "$GITHUB_REPOSITORY" --json databaseId,status,createdAt,updatedAt --limit 20 > /tmp/runs.json
          python - <<'PY'
          import datetime
          import json
          import os

          rows = json.load(open('/tmp/runs.json', encoding='utf-8'))
          now = datetime.datetime.now(datetime.timezone.utc)
          active = []
          stale = 0

          for row in rows:
              if row.get('status') not in {'queued','in_progress','pending'}:
                  continue
              active.append(row['databaseId'])
              updated = datetime.datetime.fromisoformat(row['updatedAt'].replace('Z','+00:00'))
              if now - updated > datetime.timedelta(minutes=15) and not stale:
                  stale = row['databaseId']

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'active={len(active)}\n')
              output.write(f'stale_run={stale}\n')
          print(f'active={len(active)} stale_run={stale or "none"}')
          PY

      - name: Cancel stale digest run
        if: steps.active.outputs.stale_run != '0' && steps.active.outputs.stale_run != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run cancel "${{ steps.active.outputs.stale_run }}" --repo "$GITHUB_REPOSITORY"

      - name: Trigger missing slot
        if: steps.check.outputs.slot_id != '' && (steps.active.outputs.active == '0' || steps.active.outputs.stale_run != '0')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLOT_ID: ${{ steps.check.outputs.slot_id }}
        run: |
          echo "Recovering missing digest slot $SLOT_ID"
          gh workflow run "News Digest" --repo "$GITHUB_REPOSITORY" --ref main -f slot_id="$SLOT_ID"

      - name: Healthy
        if: steps.check.outputs.slot_id == ''
        run: echo "No eligible missing digest slot."
