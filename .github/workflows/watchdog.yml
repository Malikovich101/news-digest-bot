name: Digest Watchdog

on:
  schedule:
    # Four checks per hour, away from :00 when GitHub Actions is busiest.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: digest-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Find a missing delivery slot
        id: check
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          state_path = Path("state.json")
          state = json.loads(state_path.read_text(encoding="utf-8")) if state_path.exists() else {}
          completed = state.get("completed_slots", {}) or {}
          now = datetime.datetime.now(datetime.timezone.utc)

          # v6 did not record slot ids. Infer its latest successful slot during
          # the first deployment so it is not mistaken for a missed digest.
          last_success = state.get("last_successful_run")
          if not completed and last_success:
              try:
                  last_dt = datetime.datetime.fromisoformat(last_success.replace("Z", "+00:00"))
                  legacy_slots = []
                  for day in (last_dt.date() - datetime.timedelta(days=1), last_dt.date()):
                      for name, hour in (("morning", 3), ("day", 9), ("evening", 15)):
                          expected = datetime.datetime.combine(day, datetime.time(hour, 5), tzinfo=datetime.timezone.utc)
                          if expected <= last_dt:
                              legacy_slots.append((expected, f"{day.isoformat()}-{name}"))
                  if legacy_slots:
                      completed[max(legacy_slots)[1]] = last_dt.isoformat()
              except (TypeError, ValueError):
                  pass
          candidates = []

          # Keep yesterday's evening slot eligible after midnight as well.
          for day in (now.date() - datetime.timedelta(days=1), now.date()):
              for name, hour in (("morning", 3), ("day", 9), ("evening", 15)):
                  expected = datetime.datetime.combine(day, datetime.time(hour, 5), tzinfo=datetime.timezone.utc)
                  slot_id = f"{day.isoformat()}-{name}"
                  if expected + datetime.timedelta(minutes=15) <= now <= expected + datetime.timedelta(hours=24):
                      if slot_id not in completed:
                          candidates.append((expected, slot_id))

          candidates.sort()
          slot_id = candidates[0][1] if candidates else ""
          print(f"now={now.isoformat()} completed={len(completed)} missing_slot={slot_id or 'none'}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"slot_id={slot_id}\n")
          PY

      - name: Trigger only the missing slot
        if: steps.check.outputs.slot_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLOT_ID: ${{ steps.check.outputs.slot_id }}
        run: |
          echo "Digest slot $SLOT_ID is missing; requesting a recovery run."
          gh workflow run "News Digest" --repo "$GITHUB_REPOSITORY" --ref main \
            -f replay_hours=0 -f slot_id="$SLOT_ID"

      - name: Log healthy status
        if: steps.check.outputs.slot_id == ''
        run: echo "All eligible digest slots have completed."
