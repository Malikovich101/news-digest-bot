name: Digest Watchdog

on:
  schedule:
    - cron: '10,30,50 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: digest-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Find missing slot
        id: check
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          now = datetime.datetime.now(datetime.timezone.utc)
          path = Path("state.json")
          state = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          completed = state.get("completed_slots", {}) or {}

          candidates = []
          for day in (now.date() - datetime.timedelta(days=1), now.date()):
              for name, hour in (("morning", 3), ("day", 9), ("evening", 15)):
                  expected = datetime.datetime.combine(day, datetime.time(hour, 5), tzinfo=datetime.timezone.utc)
                  slot_id = f"{day.isoformat()}-{name}"
                  # Give the scheduled workflow 45 minutes before recovery.
                  # Do not recover a slot older than 24 hours.
                  if expected + datetime.timedelta(minutes=45) <= now <= expected + datetime.timedelta(hours=24) and slot_id not in completed:
                      candidates.append((expected, slot_id))

          candidates.sort()
          slot_id = candidates[0][1] if candidates else ""
          print(f"now={now.isoformat()} missing={slot_id or 'none'} completed={len(completed)}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"slot_id={slot_id}\n")
          PY

      - name: Check for stale active runs
        id: active
        if: steps.check.outputs.slot_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --workflow "News Digest" --repo "$GITHUB_REPOSITORY" --json databaseId,status,createdAt,updatedAt --limit 10 > /tmp/runs.json
          python - <<'PY'
          import datetime, json, os
          rows = json.load(open('/tmp/runs.json', encoding='utf-8'))
          now = datetime.datetime.now(datetime.timezone.utc)
          stale = 0
          active = 0
          for row in rows:
              if row.get('status') in {'queued','in_progress','pending'}:
                  active += 1
                  updated = datetime.datetime.fromisoformat(row['updatedAt'].replace('Z','+00:00'))
                  if now - updated > datetime.timedelta(minutes=15):
                      stale = row['databaseId']
                      break
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'active={active}\n')
              output.write(f'stale_run={stale}\n')
          print(f'active={active} stale_run={stale or "none"}')
          PY

      - name: Cancel stale digest run
        if: steps.active.outputs.stale_run != '0' && steps.active.outputs.stale_run != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run cancel "${{ steps.active.outputs.stale_run }}" --repo "$GITHUB_REPOSITORY"

      - name: Trigger missing slot
        if: steps.check.outputs.slot_id != '' && (steps.active.outputs.active == '0' || steps.active.outputs.stale_run != '0')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLOT_ID: ${{ steps.check.outputs.slot_id }}
        run: |
          echo "Recovering missing digest slot $SLOT_ID"
          gh workflow run "News Digest" --repo "$GITHUB_REPOSITORY" --ref main -f slot_id="$SLOT_ID"

      - name: Healthy
        if: steps.check.outputs.slot_id == ''
        run: echo "No eligible missing digest slot."
